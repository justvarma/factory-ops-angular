<div class="min-h-screen bg-neutral-50 flex font-sans">
  <!-- Sidebar -->
  <aside 
    class="bg-[#0f172a] transition-all duration-300 flex flex-col"
    [class.w-64]="isSidebarOpen"
    [class.w-20]="!isSidebarOpen"
  >
    <div class="p-6 flex items-center justify-between">
      @if (isSidebarOpen) {
        <span class="font-bold text-xl text-white tracking-tight">
          FactoryOps
        </span>
      }
      <button 
        (click)="toggleSidebar()"
        class="p-2 hover:bg-white/10 rounded-lg text-slate-400 transition-colors"
      >
        <lucide-angular [name]="isSidebarOpen ? 'X' : 'Menu'" size="20"></lucide-angular>
      </button>
    </div>

    <nav class="flex-1 px-0 space-y-1 mt-4">
      @for (item of navItems; track item.name) {
        <a 
          [routerLink]="item.href"
          [routerLinkActive]="'bg-white/5 text-white border-l-4 border-blue-500'"
          [routerLinkActiveOptions]="{exact: true}"
          class="flex items-center p-3 px-6 transition-all group relative text-slate-400 hover:bg-white/5 hover:text-white border-l-4 border-transparent"
        >
          <lucide-angular [name]="item.icon" size="20" class="group-hover:text-slate-300"></lucide-angular>
          @if (isSidebarOpen) {
            <span class="ml-3 font-medium text-sm">
              {{ item.name }}
            </span>
          }
        </a>
      }
    </nav>

    <div class="p-4 border-t border-white/10">
      <button 
        (click)="logout()"
        class="w-full flex items-center p-3 px-6 rounded-xl text-slate-400 hover:text-red-400 hover:bg-red-400/10 transition-all group"
      >
        <lucide-angular name="LogOut" size="20"></lucide-angular>
        @if (isSidebarOpen) {
          <span class="ml-3 font-medium text-sm">
            Logout
          </span>
        }
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
      <h2 class="text-lg font-semibold text-slate-800">
        Dashboard
      </h2>
      <div class="flex items-center gap-4">
        <div class="text-right hidden sm:block">
          <div class="text-sm font-semibold text-slate-900">Operations Admin</div>
          <div class="text-xs text-slate-500">Administrator</div>
        </div>
        <div class="w-9 h-9 bg-blue-600 rounded-full border border-blue-500 flex items-center justify-center text-white shadow-sm shadow-blue-200">
          <lucide-angular name="Cpu" size="18"></lucide-angular>
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-4 md:p-8 bg-[#f8fafc]">
      <div [@fadeIn]>
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
