<div class="min-h-screen bg-[#f8fafc] flex items-center justify-center p-6 font-sans">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white mx-auto shadow-xl shadow-blue-200 mb-6">
        <lucide-angular [name]="LogIn" size="32"></lucide-angular>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">FactoryOps</h1>
      <p class="text-slate-500 mt-2 font-medium">Operations Management System</p>
    </div>

    <div class="bg-white p-10 rounded-3xl shadow-xl shadow-slate-200 border border-slate-100">
      <h2 class="text-xl font-bold text-slate-900 mb-8">Sign In</h2>
      
      <form (submit)="onSubmit()" class="space-y-6">
        <div *ngIf="error" class="bg-red-50 border border-red-100 p-4 rounded-xl flex items-center gap-3 text-red-600">
          <lucide-angular [name]="AlertCircle" size="20"></lucide-angular>
          <p class="text-sm font-bold">{{ error }}</p>
        </div>

        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Account Email</label>
          <div class="relative group">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors">
              <lucide-angular [name]="User" size="18"></lucide-angular>
            </div>
            <input 
              type="email" 
              name="email"
              [(ngModel)]="email"
              required
              class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/5 focus:border-blue-500 text-slate-900 transition-all font-medium placeholder:text-slate-300" 
              placeholder="admin@factory.com"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Security Password</label>
          <div class="relative group">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors">
              <lucide-angular [name]="Lock" size="18"></lucide-angular>
            </div>
            <input 
              type="password" 
              name="password"
              [(ngModel)]="password"
              required
              class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/5 focus:border-blue-500 text-slate-900 transition-all font-medium placeholder:text-slate-300" 
              placeholder="••••••••"
            />
          </div>
        </div>

        <button 
          type="submit" 
          [disabled]="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98] mt-4 flex items-center justify-center gap-3"
        >
          <span *ngIf="!loading">Continue to Dashboard</span>
          <div *ngIf="loading" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
      </form>
    </div>

    <p class="text-center text-slate-400 text-sm mt-8">
      Problems signing in? <a href="#" class="text-blue-600 font-bold hover:underline">Contact System Admin</a>
    </p>
  </div>
</div>
